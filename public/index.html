<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カード対戦ゲーム</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: #ecf0f1; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; position: relative; }
        .card { background: #34495e; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn { background: #e67e22; border: none; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; }

        /* 右上設定ボタン */
        .settings-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #7f8c8d;
            font-size: 14px;
            padding: 8px 12px;
        }

        /* モーダル汎用（画面の絶対中央配置） */
        .modal {
            display: none;
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            /* 縦横中央に要素を寄せる Flexbox 設定 */
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }

        /* JavaScript等でモーダルを表示する際のクラス */
        .modal[style*="display: block"] {
            display: flex !important;
        }

        .modal-content {
            background: #34495e;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #bdc3c7;
            max-width: 500px;
            width: 100%;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* 罠モーダル特有 */
        #trap-modal-content {
            border-color: #e74c3c;
            text-align: center;
        }
        .trap-btn { font-size: 20px; padding: 15px 25px; margin: 10px; background: #3498db; }

        /* スイッチリストUI */
        .switch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #2c3e50;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        /* 麻雀風卓レイアウト（手札の高さに合わせて自動伸縮するように修正） */
        .mj-table {
            display: grid;
            grid-template-columns: 220px 1fr 220px;
            grid-template-rows: auto 1fr auto; /* 柔軟に高さが伸縮するよう調整 */
            grid-template-areas: 
                "left   top    right"
                "left   center right"
                "bottom bottom bottom"; /* 領域の位置関係を指定 */
            gap: 10px;
            background: #1e3799;
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            min-height: 720px;
        }

        /* 各座席の配置 */
        .seat-top    { grid-area: top; }
        .seat-left   { grid-area: left; }
        .seat-right  { grid-area: right; }
        .seat-bottom { grid-area: bottom; }

        /* プレイヤーボックス共通スタイル */
        .player-box {
            background: rgba(26, 37, 47, 0.85);
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 10px;
            color: #ecf0f1;
            font-size: 0.85em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: border-color 0.35s ease;
        }

        /* ターンプレイヤーの強調 */
        .player-box.active {
            border-color: #f1c40f;
            box-shadow: 0 0 12px #f1c40f;
        }

        /* 卓の中央（情報・ログエリア＆ドロップゾーン） */
        .table-center {
            grid-area: center;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px dashed #334155;
            transition: all 0.2s ease;
        }

        /* ドロップホバー状態 */
        .table-center.drag-over {
            background: rgba(41, 128, 185, 0.95) !important;
            border-color: #f1c40f !important;
            box-shadow: 0 0 20px #f1c40f;
        }

        /* 自分（手前）のスタイリング */
        .seat-bottom .player-box {
            background: rgba(15, 23, 42, 0.95);
            border-width: 3px;
        }

        /* ミニカード（他プレイヤーの場・罠用） */
        .mini-card-icon {
            width: 22px;
            height: 32px;
            object-fit: contain;
            border-radius: 2px;
            vertical-align: middle;
        }

        /* ドラッグ可能な防御カード */
        .draggable-def-card {
            cursor: grab;
            border: 1px dashed #f1c40f;
        }

        /* スロット横並び表示 */
        .trap-slots-container {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .trap-slot-item {
            background: rgba(0,0,0,0.3);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            border: 1px solid #475569;
        }

        /* 自分の手札コンテナ（はみ出しを許可し、ツールチップを見切れなくする） */
        .my-hand-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            padding: 15px 5px 5px 5px; /* 上部に余白を確保 */
            overflow: visible;         /* auto から visible に変更して見切りを防止 */
            flex-wrap: wrap;           /* 枚数が多い場合は折り返す */
        }

        .card-img {
            width: 80px;
            height: 116px;
            object-fit: contain;
            background-color: #000;
            border-radius: 6px;
            display: block;
            cursor: grab;
            border: 2px solid #475569;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-img:hover {
            transform: translateY(-6px);
            border-color: #f1c40f;
        }

        /* 手札カードホバー用のラッパー */
        .hand-card-wrapper {
            position: relative;
            display: inline-block;
            z-index: 1; /* 通常時の重なり順 */
        }

        /* ホバーされたカードを最前面にする */
        .hand-card-wrapper:hover {
            z-index: 10;
        }

        /* ツールチップ（効果説明吹き出し） */
        .card-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 115%; /* 表示位置を少し上へずらす */
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: rgba(15, 23, 42, 0.98);
            color: #f8fafc;
            border: 1px solid #f1c40f;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8em;
            line-height: 1.4;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            z-index: 9999; /* 他の要素より確実に前に表示 */
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .card-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #f1c40f transparent transparent transparent;
        }

        .hand-card-wrapper:hover .card-tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn settings-btn" onclick="openSettingsModal()">⚙ デバッグ設定</button>

        <h2>対戦カードゲーム</h2>
        <div id="status">接続待機中...</div>

        <!-- ドラフトエリア -->
        <div id="draft-area" class="card" style="display: none;"></div>

        <!-- ゲームメイン画面 -->
        <div id="game-main" style="display: none;">
            <div class="mj-table">
                <!-- 対面（奥） -->
                <div class="seat-top" id="seat-top"></div>

                <!-- 下家（右） -->
                <div class="seat-right" id="seat-right"></div>

                <!-- 卓の中央（ログ＆ドロップエリア） -->
                <!-- 卓の中央（ログ＆ドロップエリア） -->
                <div class="table-center" 
                     ondragover="handleCenterDragOver(event)" 
                     ondragenter="handleCenterDragEnter(event)" 
                     ondragleave="handleCenterDragLeave(event)" 
                     ondrop="handleCenterDrop(event)">
                    <div id="round-info" style="font-size: 1.1em; font-weight: bold; text-align: center; color: #f1c40f;"></div>
                    
                    <!-- ログとターン終了ボタンの横並びエリア -->
                    <div style="display: flex; gap: 8px; align-items: stretch; margin: 5px 0;">
                        <div id="log-box" style="flex: 1; height: 110px; overflow-y: auto; background: #000; padding: 8px; font-family: monospace; font-size: 0.8em; border-radius: 4px;"></div>
                        <div id="center-end-turn-btn" style="display: flex; align-items: center;"></div>
                    </div>

                    <div id="center-status" style="font-size: 0.85em; text-align: center; color: #38bdf8; font-weight: bold;">
                        ここにカードをドラッグ＆ドロップして使用
                    </div>
                </div>

                <!-- 上家（左） -->
                <div class="seat-left" id="seat-left"></div>

                <!-- 自分（手前） -->
                <div class="seat-bottom" id="seat-bottom"></div>
            </div>
        </div>

        <!-- 手札オーバー破棄選択モーダル -->
    <div id="discard-modal" class="modal">
        <div class="modal-content" style="text-align:center; max-width:600px;">
            <h3 style="margin-top:0; color:#e74c3c;">★ 手札オーバー！</h3>
            <p style="margin: 10px 0; font-size: 0.95em; color:#cbd5e1;">
                1枚以下になるように捨てるカードを選択してください。
            </p>
            <div id="discard-cards-container" style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:15px;"></div>
        </div>
    </div>
        
        <!-- ターン開始ボーナス選択モーダル -->
    <div id="bonus-choice-modal" class="modal">
        <div class="modal-content" style="text-align:center; max-width:400px;">
            <h3 style="margin-top:0; color:#f1c40f;">★ あなたのターンです</h3>
            <p style="margin: 15px 0; font-size: 1.05em; line-height: 1.5;">
                ターン開始ボーナス (+3000点) を獲得しますか？
            </p>
            <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#27ae60; padding:12px; font-weight:bold;" onclick="chooseBonusChoice(true)">
                    ボーナスを受け取る (+3000点 & カード獲得)
                </button>
                <button class="btn" style="background:#7f8c8d; padding:10px;" onclick="chooseBonusChoice(false)">
                    受け取らない (カードのみ獲得)
                </button>
            </div>
        </div>
    </div>

    <!-- カード操作モーダル（ドロップ時に表示） -->
    <div id="drop-action-modal" class="modal">
        <div class="modal-content" style="text-align:center; max-width:420px;">
            <h3 id="drop-modal-title" style="margin-top:0; color:#f1c40f;">カード操作</h3>
            <div id="drop-modal-card-preview" style="margin: 10px 0;"></div>
            <div id="drop-modal-actions" style="margin-top: 15px;"></div>
            <div style="margin-top: 15px; border-top: 1px solid #475569; padding-top: 10px;">
                <button class="btn" style="background:#7f8c8d;" onclick="closeDropActionModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- カードスイッチ設定モーダル -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">⚙ カード排出スイッチ (デバッグ)</h3>
            <p style="font-size: 0.85em; color: #bdc3c7;">OFFにするとターン開始時のカード獲得で引けなくなります。</p>
            <div id="card-switches"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="btn" style="background:#7f8c8d;" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 罠対決モーダルUI -->
    <div id="trap-modal" class="modal">
        <div id="trap-modal-content" class="modal-content">
            <h2 style="color: #e74c3c;">【 罠 発 動 ! 】</h2>
            <p id="trap-desc">攻撃が発生しました！選択してください。</p>
            <div id="trap-buttons">
                <button class="btn trap-btn" onclick="sendTrapChoice('LEFT')">左</button>
                <button class="btn trap-btn" onclick="sendTrapChoice('CENTER')">中</button>
                <button class="btn trap-btn" onclick="sendTrapChoice('RIGHT')">右</button>
            </div>
            <p id="trap-status-text" style="color: #f1c40f; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = null;
        let myPlayerNumber = null;
        let latestGameState = null;
        let currentCardSettings = {};
        let draggedCardData = null;

        const CARD_NAMES = {
            gold_bag: '金袋',
            wood_sword: '木の剣',
            wood_shield: '木の盾',
            wood_shield_set: '木の盾セット'
        };

        socket.on('connect', () => { myId = socket.id; });

        socket.on('init', (data) => {
            myPlayerNumber = data.playerNumber;
            myId = data.id;
            document.getElementById('status').innerText = `あなたは P${myPlayerNumber} です。他のプレイヤーを待っています...`;
        });

        socket.on('playerUpdate', (data) => {
            if (!latestGameState || !latestGameState.started) {
                document.getElementById('status').innerText = `現在の参加人数: ${data.playerCount} / 4 人`;
            }
        });

        socket.on('updateCardSettings', (settings) => {
            currentCardSettings = settings;
            renderCardSwitches();
        });

        function renderCardSwitches() {
            const container = document.getElementById('card-switches');
            if (!container) return;
            container.innerHTML = '';

            Object.keys(CARD_NAMES).forEach(cardId => {
                const isEnabled = currentCardSettings[cardId] !== false;
                const div = document.createElement('div');
                div.className = 'switch-item';
                div.innerHTML = `
                    <span><b>${CARD_NAMES[cardId]}</b></span>
                    <label>
                        <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleCard('${cardId}', this.checked)">
                        ${isEnabled ? 'ON' : 'OFF'}
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function toggleCard(cardId, enabled) {
            socket.emit('toggleCardSetting', { cardId, enabled });
        }

        function openSettingsModal() { document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

        socket.on('draftStart', (data) => {
            renderDraftUI(data.availableScores, '最初の得点を選択してください：');
        });

        socket.on('draftConflict', (data) => {
            const draftArea = document.getElementById('draft-area');
            updatePlayersUI(data.players, null);
            if (data.unresolvedIds.includes(myId)) {
                document.getElementById('status').innerText = '選択が被りました！再選択してください。';
                if (draftArea) renderDraftUI(data.availableScores, '残りの選択肢から選んでください：');
            } else {
                document.getElementById('status').innerText = 'あなたの得点は確定しました。他のプレイヤーの再選択を待っています...';
                if (draftArea) {
                    draftArea.style.display = 'block';
                    draftArea.innerHTML = '';
                }
            }
        });

        function renderDraftUI(scores, titleText) {
            const draftArea = document.getElementById('draft-area');
            if (!draftArea) return;
            draftArea.style.display = 'block';
            draftArea.innerHTML = `<h3>${titleText}</h3><div id="draft-btns"></div>`;
            const btnContainer = document.getElementById('draft-btns');

            scores.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = (s > 0 ? '+' : '') + s + '点';
                btn.onclick = () => {
                    socket.emit('selectDraftScore', s);
                    btnContainer.querySelectorAll('button').forEach(b => b.disabled = true);
                    document.getElementById('status').innerText = '選択を送信しました。他のプレイヤーを待っています...';
                };
                btnContainer.appendChild(btn);
            });
        }

        socket.on('trapBattleStart', (data) => {
            const modal = document.getElementById('trap-modal');
            const desc = document.getElementById('trap-desc');
            const statusText = document.getElementById('trap-status-text');
            const btns = document.getElementById('trap-buttons');

            modal.style.display = 'block';
            statusText.innerText = '';

            if (myId === data.attackerId || myId === data.targetId) {
                desc.innerHTML = `<b>${data.attackerName}</b> が <b>${data.targetName}</b> のスロット${data.slotNum}に攻撃！<br>罠「${data.trapName}」が作動しました。<br>10秒以内に【左・中・右】を選択してください！`;
                btns.style.display = 'block';
                btns.querySelectorAll('button').forEach(b => b.disabled = false);
            } else {
                desc.innerHTML = `<b>${data.attackerName}</b> と <b>${data.targetName}</b> が罠対決中です...`;
                btns.style.display = 'none';
            }
        });

        function sendTrapChoice(choice) {
            socket.emit('selectTrapChoice', choice);
            const btns = document.getElementById('trap-buttons');
            btns.querySelectorAll('button').forEach(b => b.disabled = true);
            document.getElementById('trap-status-text').innerText = '選択を送信しました。相手の選択を待っています...';
        }

        socket.on('trapBattleEnd', (data) => {
            document.getElementById('trap-modal').style.display = 'none';
        });

        socket.on('errorMessage', (msg) => { alert(msg); });

        socket.on('syncGameState', (data) => {
            latestGameState = data;
            document.getElementById('status').innerText = '';

            const draftArea = document.getElementById('draft-area');
            if (draftArea) {
                draftArea.style.display = 'none';
                draftArea.innerHTML = '';
            }

            document.getElementById('game-main').style.display = 'block';
            document.getElementById('round-info').innerText = `第 ${data.round} 巡目 / 全10巡`;
            if (data.log) {
                const logBox = document.getElementById('log-box');
                logBox.innerText = data.log + '\n' + logBox.innerText;
            }

            updatePlayersUI(data.players, data.currentTurnPlayerId);
            updateTurnControls(data);
        });

        // --- ドラッグ＆ドロップ用処理 ---
        function handleCardDragStart(event, instanceId, source) {
            draggedCardData = { instanceId, source };
            event.dataTransfer.setData('text/plain', JSON.stringify(draggedCardData));
        }

        function handleCenterDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function handleCenterDragEnter(event) {
            event.preventDefault();
            const center = document.querySelector('.table-center');
            if (center) center.classList.add('drag-over');
        }

        function handleCenterDragLeave(event) {
            const center = document.querySelector('.table-center');
            if (center) center.classList.remove('drag-over');
        }

        function handleCenterDrop(event) {
            event.preventDefault();
            const center = document.querySelector('.table-center');
            if (center) center.classList.remove('drag-over');

            if (!latestGameState) return;

            const currentTurnId = latestGameState.currentTurnPlayerId;
            if (myId !== currentTurnId || latestGameState.turnPhase !== 'MAIN') {
                alert('自分のターンのメインフェーズでのみカードを使用・配置できます。');
                return;
            }

            let data = draggedCardData;
            try {
                const raw = event.dataTransfer.getData('text/plain');
                if (raw) data = JSON.parse(raw);
            } catch(e){}

            if (!data) return;

            openDropCardModal(data.source, data.instanceId);
        }

        // --- UIレンダリング ---
        function updatePlayersUI(players, currentTurnPlayerId) {
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);
            const playerList = Object.values(players).sort((a, b) => a.number - b.number);
            
            let myIndex = playerList.findIndex(p => p.id === myId);
            if (myIndex === -1) myIndex = 0;

            const totalPlayers = playerList.length;

            const seats = {
                bottom: document.getElementById('seat-bottom'),
                right:  document.getElementById('seat-right'),
                top:    document.getElementById('seat-top'),
                left:   document.getElementById('seat-left')
            };

            Object.values(seats).forEach(s => { if(s) s.innerHTML = ''; });

            const seatKeys = ['bottom', 'right', 'top', 'left'];

            playerList.forEach((p, idx) => {
                const relativePos = (idx - myIndex + totalPlayers) % totalPlayers;
                const targetSeatKey = seatKeys[relativePos];
                const targetContainer = seats[targetSeatKey];

                if (!targetContainer) return;

                const isMe = (p.id === myId);
                const isTurn = (p.id === currentTurnPlayerId);
                const rank = sorted.findIndex(sp => sp.id === p.id) + 1;

                const box = document.createElement('div');
                box.className = `player-box ${isTurn ? 'active' : ''}`;

                // 防御カード情報の表示（自分の防御カードはドラッグ可能）
                let defInfo = '<span style="color:#7f8c8d;">なし</span>';
                if (p.defenseCard) {
                    const card = p.defenseCard.card;
                    const isDraggable = isMe ? 'draggable="true" ondragstart="handleCardDragStart(event, null, \'DEFENSE\')"' : '';
                    defInfo = `
                        <span style="color:#2ecc71;">
                            ${card.image ? `<img src="${card.image}" class="mini-card-icon ${isMe ? 'draggable-def-card' : ''}" ${isDraggable} title="${isMe ? '中央エリアにドラッグして操作' : ''}">` : ''}
                            ${card.name} (${p.defenseCard.usesLeft}回)
                        </span>
                    `;
                }

                // 罠スロット情報の表示
                let trapHtml = '<div class="trap-slots-container">';
                [1, 2, 3].forEach(slotNum => {
                    const trapObj = p.trapSlots ? p.trapSlots[slotNum] : null;
                    if (trapObj) {
                        const roundStr = trapObj.placedRound !== undefined ? `${trapObj.placedRound}巡` : '';
                        if (isMe || trapObj.revealed) {
                            trapHtml += `
                                <div class="trap-slot-item" style="border-color:#e74c3c;">
                                    ${trapObj.card.image ? `<img src="${trapObj.card.image}" class="mini-card-icon">` : ''}
                                    <span style="color:#e74c3c;">S${slotNum}:${trapObj.card.name}(${trapObj.usesLeft}回)</span>
                                </div>`;
                        } else {
                            trapHtml += `
                                <div class="trap-slot-item" style="border-color:#e67e22;">
                                    <span style="color:#e67e22;">S${slotNum}: 罠(${roundStr})</span>
                                </div>`;
                        }
                    } else {
                        trapHtml += `
                            <div class="trap-slot-item">
                                <span style="color:#64748b;">S${slotNum}: 空</span>
                            </div>`;
                    }
                });
                trapHtml += '</div>';

                const posNames = ['【自分】', '【下家】', '【対面】', '【上家】'];
                const posName = posNames[relativePos];

                // 自分の手札埋め込み処理
                let handHtml = '';
                if (isMe) {
                    handHtml += `<div style="margin-top:6px;"><b>手札 (中央へドラッグして使用):</b>`;
                    if (p.hand && p.hand.length > 0) {
                        handHtml += `<div class="my-hand-container">`;
                        p.hand.forEach(card => {
                            handHtml += `
                                <div class="hand-card-wrapper">
                                    <img src="${card.image}" class="card-img" alt="${card.name}" draggable="true" ondragstart="handleCardDragStart(event, '${card.instanceId}', 'HAND')">
                                    <div class="card-tooltip">
                                        <div style="font-weight: bold; color: #f1c40f; margin-bottom: 3px;">${card.name}</div>
                                        <div>${card.desc}</div>
                                    </div>
                                </div>
                            `;
                        });
                        handHtml += `</div>`;
                    } else {
                        handHtml += ` <span style="color:#7f8c8d;">(なし)</span>`;
                    }
                    handHtml += `</div>`;
                }

                // ★持ち点表示用HTMLの動的生成を追加
                let scoreDisplayHtml = '';
                if (p.scoreChange && p.scoreChange !== 0) {
                    const color = p.scoreChange > 0 ? '#2ecc71' : '#e74c3c'; // プラス:緑 / マイナス:赤
                    const sign = p.scoreChange > 0 ? '+' : '';
                    scoreDisplayHtml = `持ち点: ${p.prevScore.toLocaleString()}点<span style="color: ${color}; font-weight: bold;">${sign}${p.scoreChange.toLocaleString()}点</span>→${p.score.toLocaleString()}点`;
                } else {
                    scoreDisplayHtml = `持ち点: ${p.score.toLocaleString()}点`;
                }

                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${posName} P${p.number} ${isMe ? '(あなた)' : ''} ${isTurn ? '★' : ''}</strong>
                        <span style="color:#f1c40f; font-weight:bold;"> ${rank}位</span>
                    </div>
                    <div style="font-size: 1.1em; font-weight: bold; margin: 3px 0; color: #38bdf8;">
                        ${scoreDisplayHtml} <!-- ★ここを修正（直接 p.score を出していたのを変数に変更） -->
                    </div>
                    <div>手札: <b>${p.hand ? p.hand.length : 0}</b> 枚 | 防御: ${defInfo}</div>
                    <div style="margin-top:3px;"><b>罠:</b> ${trapHtml}</div>
                    ${handHtml}
                `;

                targetContainer.appendChild(box);
            });
        }

        function chooseBonusChoice(accept) {
            socket.emit('chooseBonus', accept);
            document.getElementById('bonus-choice-modal').style.display = 'none';
        }

        function updateTurnControls(data) {
            const roundInfo = document.getElementById('round-info');
            const endTurnBtnContainer = document.getElementById('center-end-turn-btn');
            const bonusModal = document.getElementById('bonus-choice-modal');
            const discardModal = document.getElementById('discard-modal');
            
            const isMyTurn = (data.currentTurnPlayerId === myId);
            const myPlayer = data.players[myId];

            // 初期化（panel関連の処理を削除）
            roundInfo.innerHTML = `第 ${data.round} 巡目 / 全10巡`;
            endTurnBtnContainer.innerHTML = '';
            if (bonusModal) bonusModal.style.display = 'none';
            if (discardModal) discardModal.style.display = 'none';

            if (!isMyTurn) {
                return;
            }

            if (data.turnPhase === 'BONUS_CHOICE') {
                if (bonusModal) bonusModal.style.display = 'block';
                roundInfo.innerHTML += ` <span style="color:#f1c40f;">【ボーナス選択中】</span>`;
            } else if (data.turnPhase === 'MAIN') {
                roundInfo.innerHTML += `<br><span style="color:#f1c40f; font-size: 0.85em;">★ あなたのターンです。手札や防御カードを画面中央へドラッグ＆ドロップして操作してください。</span>`;
                
                endTurnBtnContainer.innerHTML = `
                    <button class="btn" style="background:#2980b9; height:100%; white-space:nowrap; margin:0; padding:0 12px; font-weight:bold;" onclick="socket.emit('endTurn')">
                        ターンを<br>終了する
                    </button>
                `;
            } else if (data.turnPhase === 'DISCARD') {
                roundInfo.innerHTML += ` <span style="color:#e74c3c;">【手札オーバー】</span>`;
                
                // ディスカードモーダルの要素を取得して中身を生成
                const discardContainer = document.getElementById('discard-cards-container');
                if (discardContainer && myPlayer && myPlayer.hand) {
                    discardContainer.innerHTML = '';
                    myPlayer.hand.forEach(card => {
                        const itemDiv = document.createElement('div');
                        itemDiv.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:8px; background:#1a252f; padding:10px; border-radius:8px; border:1px solid #475569;';
                        itemDiv.innerHTML = `
                            <img src="${card.image}" style="width:90px; height:130px; object-fit:contain; border-radius:4px; background:#000;" alt="カード">
                            <button class="btn" style="background:#e74c3c; width:100%; margin:0; padding:6px 0; font-weight:bold;" onclick="socket.emit('discardCard', '${card.instanceId}')">捨てる</button>
                        `;
                        discardContainer.appendChild(itemDiv);
                    });
                    if (discardModal) discardModal.style.display = 'block';
                }
            }
        }

        // --- ドロップ時のポップアップモーダル制御 ---
        function closeDropActionModal() {
            document.getElementById('drop-action-modal').style.display = 'none';
        }

        function openDropCardModal(source, instanceId) {
            if (!latestGameState) return;
            const myPlayer = latestGameState.players[myId];
            if (!myPlayer) return;

            const modal = document.getElementById('drop-action-modal');
            const preview = document.getElementById('drop-modal-card-preview');
            const actions = document.getElementById('drop-modal-actions');
            const title = document.getElementById('drop-modal-title');

            preview.innerHTML = '';
            actions.innerHTML = '';

            let card = null;
            if (source === 'HAND') {
                card = myPlayer.hand.find(c => c.instanceId === instanceId);
            } else if (source === 'DEFENSE') {
                if (myPlayer.defenseCard) card = myPlayer.defenseCard.card;
            }

            if (!card) return;

            title.innerText = source === 'HAND' ? `【手札操作】${card.name}` : `【防御カード操作】${card.name}`;

            preview.innerHTML = `
                ${card.image ? `<img src="${card.image}" style="width:110px; height:160px; object-fit:contain; border-radius:6px; margin:0 auto; display:block;">` : ''}
                <p style="font-size:0.85em; color:#cbd5e1; margin:8px 0 0 0;">${card.desc}</p>
            `;

            const emptySlots = [1, 2, 3].filter(s => !myPlayer.trapSlots || !myPlayer.trapSlots[s]);
            const hasDefense = !!myPlayer.defenseCard;
            let html = '';

            if (source === 'HAND') {
                if (card.id === 'gold_bag') {
                    html += `<button class="btn" style="background:#27ae60; font-size:1.05em; width:100%;" onclick="socket.emit('playCard', { instanceId: '${card.instanceId}' }); closeDropActionModal();">使用する (+3000点)</button>`;
                } else if (card.category === 'DEFENSE_TRAP') {
                    // 1. 攻撃機能
                    if (card.id === 'wood_sword') {
                        const myOrderIdx = latestGameState.turnOrder.indexOf(myId);
                        html += `<div style="background:#1a252f; padding:10px; border-radius:6px; margin-bottom:10px; text-align:left;">`;
                        html += `<b style="color:#e74c3c;">⚔ 攻撃する:</b><br>`;
                        html += `対象: <select id="drop-target-${card.instanceId}" onchange="updateDropAttackSlotOptions('${card.instanceId}')">`;
                        Object.values(latestGameState.players).forEach(p => {
                            if (p.id !== myId) {
                                const pOrderIdx = latestGameState.turnOrder.indexOf(p.id);
                                if (latestGameState.round === 1 && pOrderIdx > myOrderIdx) {
                                } else if (p.immunityCount && p.immunityCount > 0) {
                                    html += `<option value="${p.id}" disabled>${p.name} (選択不可残:${p.immunityCount})</option>`;
                                } else {
                                    html += `<option value="${p.id}">${p.name}</option>`;
                                }
                            }
                        });
                        html += `</select><br>`;
                        html += `<span id="drop-slot-container-${card.instanceId}">スロット: <select id="drop-slot-${card.instanceId}"></select></span><br>`;
                        html += `<button class="btn" style="background:#e74c3c; margin-top:5px; width:100%;" onclick="executeDropPlayCard('${card.instanceId}', 'ATTACK')">攻撃実行</button>`;
                        html += `</div>`;
                    }

                    // 2. 防御にセット
                    html += `<div style="margin-bottom:8px;">`;
                    if (hasDefense) {
                        html += `<button class="btn" disabled style="background:#7f8c8d; width:100%;">防御にセット不可 (すでにセット中)</button>`;
                    } else {
                        html += `<button class="btn" style="background:#2980b9; width:100%;" onclick="socket.emit('playCard', { instanceId: '${card.instanceId}', actionTarget: 'DEFENSE' }); closeDropActionModal();">防御にセット</button>`;
                    }
                    html += `</div>`;

                    // 3. 罠にセット
                    html += `<div>`;
                    if (hasDefense) {
                        html += `<button class="btn" disabled style="background:#7f8c8d; width:100%;">罠にセット不可 (防御セット中)</button>`;
                    } else if (emptySlots.length > 0) {
                        html += `<div style="display:flex; gap:5px; justify-content:center; align-items:center;">`;
                        html += `スロット: <select id="drop-set-slot-${card.instanceId}">`;
                        emptySlots.forEach(s => {
                            html += `<option value="${s}">スロット${s}</option>`;
                        });
                        html += `</select>`;
                        html += `<button class="btn" style="background:#8e44ad; flex:1;" onclick="executeDropPlayCard('${card.instanceId}', 'TRAP')">罠にセット</button>`;
                        html += `</div>`;
                    } else {
                        html += `<button class="btn" disabled style="background:#7f8c8d; width:100%;">罠スロット満杯</button>`;
                    }
                    html += `</div>`;
                }
            } else if (source === 'DEFENSE') {
                // 防御カードの操作オプション
                if (card.id === 'wood_sword') {
                    const myOrderIdx = latestGameState.turnOrder.indexOf(myId);
                    html += `<div style="background:#1a252f; padding:10px; border-radius:6px; margin-bottom:10px; text-align:left;">`;
                    html += `<b style="color:#e74c3c;">⚔ 防御を外して攻撃:</b><br>`;
                    html += `対象: <select id="drop-def-attack-target" onchange="updateDropDefAttackSlotOptions()">`;
                    Object.values(latestGameState.players).forEach(p => {
                        if (p.id !== myId) {
                            const pOrderIdx = latestGameState.turnOrder.indexOf(p.id);
                            if (latestGameState.round === 1 && pOrderIdx > myOrderIdx) {
                            } else if (p.immunityCount && p.immunityCount > 0) {
                                html += `<option value="${p.id}" disabled>${p.name} (選択不可残:${p.immunityCount})</option>`;
                            } else {
                                html += `<option value="${p.id}">${p.name}</option>`;
                            }
                        }
                    });
                    html += `</select><br>`;
                    html += `<span id="drop-def-attack-slot-container">スロット: <select id="drop-def-attack-slot"></select></span><br>`;
                    html += `<button class="btn" style="background:#e74c3c; margin-top:5px; width:100%;" onclick="executeDropDefenseAttack()">攻撃する</button>`;
                    html += `</div>`;
                }

                if (emptySlots.length > 0) {
                    html += `<div style="margin-bottom:8px; display:flex; gap:5px; justify-content:center; align-items:center;">`;
                    html += `スロット: <select id="drop-move-trap-slot">`;
                    emptySlots.forEach(s => {
                        html += `<option value="${s}">スロット${s}</option>`;
                    });
                    html += `</select>`;
                    html += `<button class="btn" style="background:#8e44ad; flex:1;" onclick="executeDropMoveDefenseToTrap()">罠に移し替える</button>`;
                    html += `</div>`;
                }

                html += `<button class="btn" style="background:#c0392b; width:100%;" onclick="socket.emit('discardDefense'); closeDropActionModal();">防御カードを破棄</button>`;
            }

            actions.innerHTML = html;
            modal.style.display = 'block';

            if (source === 'HAND' && card.id === 'wood_sword') {
                updateDropAttackSlotOptions(card.instanceId);
            }
            if (source === 'DEFENSE' && card.id === 'wood_sword') {
                updateDropDefAttackSlotOptions();
            }
        }

        // --- モーダル内スロット選択UI補助 ---
        function updateDropAttackSlotOptions(instanceId) {
            const targetSelect = document.getElementById(`drop-target-${instanceId}`);
            const slotSelect = document.getElementById(`drop-slot-${instanceId}`);
            const slotContainer = document.getElementById(`drop-slot-container-${instanceId}`);
            if (!targetSelect || !slotSelect || !latestGameState) return;

            const targetId = targetSelect.value;
            if (!targetId) {
                if (slotContainer) slotContainer.style.display = 'none';
                return;
            }

            const targetPlayer = latestGameState.players[targetId];
            if (!targetPlayer) return;

            const activeSlots = [1, 2, 3].filter(s => targetPlayer.trapSlots && targetPlayer.trapSlots[s]);
            slotSelect.innerHTML = '';

            if (activeSlots.length > 0) {
                if (slotContainer) slotContainer.style.display = 'inline';
                activeSlots.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.innerText = `スロット${s}`;
                    slotSelect.appendChild(opt);
                });
            } else {
                if (slotContainer) slotContainer.style.display = 'none';
                const opt = document.createElement('option');
                opt.value = 1;
                slotSelect.appendChild(opt);
            }
        }

        function updateDropDefAttackSlotOptions() {
            const targetSelect = document.getElementById('drop-def-attack-target');
            const slotSelect = document.getElementById('drop-def-attack-slot');
            const slotContainer = document.getElementById('drop-def-attack-slot-container');
            if (!targetSelect || !slotSelect || !latestGameState) return;

            const targetId = targetSelect.value;
            if (!targetId) {
                if (slotContainer) slotContainer.style.display = 'none';
                return;
            }

            const targetPlayer = latestGameState.players[targetId];
            if (!targetPlayer) return;

            const activeSlots = [1, 2, 3].filter(s => targetPlayer.trapSlots && targetPlayer.trapSlots[s]);
            slotSelect.innerHTML = '';

            if (activeSlots.length > 0) {
                if (slotContainer) slotContainer.style.display = 'inline';
                activeSlots.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.innerText = `スロット${s}`;
                    slotSelect.appendChild(opt);
                });
            } else {
                if (slotContainer) slotContainer.style.display = 'none';
                const opt = document.createElement('option');
                opt.value = 1;
                slotSelect.appendChild(opt);
            }
        }

        function executeDropPlayCard(instanceId, actionTarget) {
            let targetPlayerId = null;
            let trapSlotNum = null;

            if (actionTarget === 'ATTACK') {
                const targetSelect = document.getElementById(`drop-target-${instanceId}`);
                if (targetSelect) targetPlayerId = targetSelect.value;
                const slotSelect = document.getElementById(`drop-slot-${instanceId}`);
                if (slotSelect) trapSlotNum = slotSelect.value;
            } else if (actionTarget === 'TRAP') {
                const setSlotSelect = document.getElementById(`drop-set-slot-${instanceId}`);
                if (setSlotSelect) trapSlotNum = setSlotSelect.value;
            }

            socket.emit('playCard', { instanceId, actionTarget, targetPlayerId, trapSlotNum });
            closeDropActionModal();
        }

        function executeDropDefenseAttack() {
            const targetSelect = document.getElementById('drop-def-attack-target');
            const slotSelect = document.getElementById('drop-def-attack-slot');
            if (!targetSelect) return;

            const targetPlayerId = targetSelect.value;
            const trapSlotNum = slotSelect ? slotSelect.value : 1;

            socket.emit('playDefenseAsAttack', { targetPlayerId, trapSlotNum });
            closeDropActionModal();
        }

        function executeDropMoveDefenseToTrap() {
            const slotSelect = document.getElementById('drop-move-trap-slot');
            if (!slotSelect) return;
            socket.emit('moveDefenseToTrap', { trapSlotNum: slotSelect.value });
            closeDropActionModal();
        }
    </script>
</body>
</html>
