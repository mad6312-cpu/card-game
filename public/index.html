<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カード対戦ゲーム</title>
    <style>
        body {
            font-family: sans-serif;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .card {
            background: #34495e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .btn {
            background: #e67e22;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }

        .btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        /* 他のモーダル(1000)より前面で常に押せるように z-index を 1050 に設定 */
        .settings-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #7f8c8d;
            font-size: 14px;
            padding: 8px 12px;
            z-index: 1050;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }

        /* デバッグ設定モーダルは最前面(1100)に表示 */
        #settings-modal {
            z-index: 1100;
        }

        .modal[style*="display: block"] {
            display: flex !important;
        }

        .modal-content {
            background: #34495e;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #bdc3c7;
            max-width: 500px;
            width: 100%;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .switch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #2c3e50;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .mj-table {
            display: grid;
            grid-template-columns: 220px 1fr 220px;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "left   top    right"
                "left   center right"
                "bottom bottom bottom";
            gap: 10px;
            background: #1e3799;
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            min-height: 720px;
        }

        .seat-top {
            grid-area: top;
        }

        .seat-left {
            grid-area: left;
        }

        .seat-right {
            grid-area: right;
        }

        .seat-bottom {
            grid-area: bottom;
        }

        .player-box {
            background: rgba(26, 37, 47, 0.85);
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 10px;
            color: #ecf0f1;
            font-size: 0.85em;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: border-color 0.35s ease;
        }

        .player-box.active {
            border-color: #f1c40f;
            box-shadow: 0 0 12px #f1c40f;
        }

        .table-center {
            grid-area: center;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px dashed #334155;
        }

        .seat-bottom .player-box {
            background: rgba(15, 23, 42, 0.95);
            border-width: 3px;
        }

        /* 防御カードのミニアイコン（ホバーモーションを追加） */
        .mini-card-icon {
            width: 22px;
            height: 32px;
            object-fit: contain;
            border-radius: 2px;
            vertical-align: middle;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* ホバー時のモーション（Y軸移動と枠線色変更） */
        .mini-card-icon:hover {
            transform: translateY(-3px);
            border-color: #f1c40f;
        }

        /* 防御カード用ラッパーとツールチップ */
        .def-card-wrapper {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            z-index: 1;
        }

        .def-card-wrapper:hover {
            z-index: 10;
        }

        .def-card-wrapper .card-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: rgba(15, 23, 42, 0.98);
            color: #f8fafc;
            border: 1px solid #f1c40f;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8em;
            line-height: 1.4;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            z-index: 9999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .def-card-wrapper:hover .card-tooltip {
            visibility: visible;
            opacity: 1;
        }

        .draggable-def-card {
            cursor: pointer;
            border: 1px dashed #f1c40f;
        }

        .my-hand-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            padding: 15px 5px 5px 5px;
            overflow: visible;
            flex-wrap: wrap;
        }

        .card-img {
            width: 80px;
            height: 116px;
            object-fit: contain;
            background-color: #000;
            border-radius: 6px;
            display: block;
            cursor: pointer;
            border: 2px solid #475569;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-img:hover {
            transform: translateY(-6px);
            border-color: #f1c40f;
        }

        .hand-card-wrapper {
            position: relative;
            display: inline-block;
            z-index: 1;
        }

        .hand-card-wrapper:hover {
            z-index: 10;
        }

        .card-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: rgba(15, 23, 42, 0.98);
            color: #f8fafc;
            border: 1px solid #f1c40f;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8em;
            line-height: 1.4;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            z-index: 9999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .card-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #f1c40f transparent transparent transparent;
        }

        .hand-card-wrapper:hover .card-tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* オーバーレイ全体 */
        .cutin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
            /* ゲーム操作を邪魔しない */
        }

        .cutin-overlay.hidden {
            display: none;
        }

        /* カットインアニメーション（出現して拡大） */
        .cutin-content {
            text-align: center;
            animation: cutInAnimation 2.5s ease-in-out forwards;
        }

        .cutin-content img {
            max-width: 300px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .cutin-content h1 {
            color: #ff3333;
            font-size: 3rem;
            margin-top: 10px;
            text-shadow: 0 0 10px #000;
        }

        @keyframes cutInAnimation {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }

            20% {
                transform: scale(1.1);
                opacity: 1;
            }

            30% {
                transform: scale(1.0);
                opacity: 1;
            }

            80% {
                transform: scale(1.0);
                opacity: 1;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* 画面左上のデバッグスコアパネル */
        .debug-score-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            padding: 10px;
            z-index: 2000;
            font-size: 12px;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .debug-score-panel summary {
            font-weight: bold;
            color: #f1c40f;
            cursor: pointer;
            user-select: none;
            padding: 2px 5px;
        }

        .debug-p-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #334155;
        }

        .debug-btn-group button {
            padding: 2px 5px;
            font-size: 10px;
            margin: 1px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            background: #34495e;
            color: #fff;
        }

        .debug-btn-group button:hover {
            background: #e67e22;
        }

        .debug-score-input {
            width: 55px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 11px;
            text-align: right;
        }
    </style>
</head>

<body>
    <!-- 画面左上 デバッグ用スコア操作パネル -->
    <details class="debug-score-panel" open>
        <summary>🛠 スコア調整 (デバッグ)</summary>
        <div id="debug-score-list" style="margin-top: 6px;">
            <div style="color: #94a3b8; font-size: 11px;">プレイヤー接続待機中...</div>
        </div>
    </details>
    <div class="container">
        <button class="btn settings-btn" onclick="openSettingsModal()">⚙ デバッグ設定</button>

        <h2>対戦カードゲーム</h2>
        <div id="status">接続待機中...</div>

        <!-- ドラフトエリア -->
        <div id="draft-area" class="card" style="display: none;"></div>

        <!-- ゲームメイン画面 -->
        <div id="game-main" style="display: none;">
            <div class="mj-table">
                <div class="seat-top" id="seat-top"></div>
                <div class="seat-right" id="seat-right"></div>

                <div class="table-center">
                    <div id="round-info"
                        style="font-size: 1.1em; font-weight: bold; text-align: center; color: #f1c40f;"></div>

                    <div style="display: flex; gap: 8px; align-items: stretch; margin: 5px 0;">
                        <div id="log-box"
                            style="flex: 1; height: 110px; overflow-y: auto; background: #000; padding: 8px; font-family: monospace; font-size: 0.8em; border-radius: 4px;">
                        </div>
                        <div id="center-end-turn-btn" style="display: flex; align-items: center;"></div>
                    </div>

                    <div id="center-status"
                        style="font-size: 0.85em; text-align: center; color: #38bdf8; font-weight: bold;">
                        手札のカードをクリックして使用
                    </div>
                </div>

                <div class="seat-left" id="seat-left"></div>
                <div class="seat-bottom" id="seat-bottom"></div>
            </div>
        </div>

        <!-- 手札オーバー破棄選択モーダル -->
        <div id="discard-modal" class="modal">
            <div class="modal-content" style="text-align:center; max-width:600px;">
                <h3 style="margin-top:0; color:#e74c3c;">★ 手札オーバー！</h3>
                <p style="margin: 10px 0; font-size: 0.95em; color:#cbd5e1;">
                    1枚以下になるように捨てるカードを選択してください。
                </p>
                <div id="discard-cards-container"
                    style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:15px;"></div>
            </div>
        </div>

        <!-- ターン開始ボーナス選択モーダル -->
        <div id="bonus-choice-modal" class="modal">
            <div class="modal-content" style="text-align:center; max-width:400px;">
                <h3 style="margin-top:0; color:#f1c40f;">★ あなたのターンです</h3>
                <p style="margin: 15px 0; font-size: 1.05em; line-height: 1.5;">
                    ターン開始ボーナス (+3000点) を獲得しますか？
                </p>
                <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
                    <button class="btn" style="background:#27ae60; padding:12px; font-weight:bold;"
                        onclick="chooseBonusChoice(true)">
                        ボーナスを受け取る (+3000点 & カード獲得)
                    </button>
                    <button class="btn" style="background:#7f8c8d; padding:10px;" onclick="chooseBonusChoice(false)">
                        受け取らない (カードのみ獲得)
                    </button>
                </div>
            </div>
        </div>

        <!-- カード操作モーダル -->
        <div id="drop-action-modal" class="modal">
            <div class="modal-content" style="text-align:center; max-width:420px;">
                <h3 id="drop-modal-title" style="margin-top:0; color:#f1c40f;">カード操作</h3>
                <div id="drop-modal-card-preview" style="margin: 10px 0;"></div>
                <div id="drop-modal-actions" style="margin-top: 15px;"></div>
                <div style="margin-top: 15px; border-top: 1px solid #475569; padding-top: 10px;">
                    <button class="btn" style="background:#7f8c8d;" onclick="closeDropActionModal()">キャンセル</button>
                </div>
            </div>
        </div>

        <!-- カードスイッチ設定モーダル -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <h3 style="margin-top:0;">⚙ カード排出スイッチ (デバッグ)</h3>
                <p style="font-size: 0.85em; color: #bdc3c7; margin-bottom: 10px;">OFFにするとターン開始時のカード獲得で引けなくなります。</p>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <button class="btn" style="background:#27ae60; padding:6px 12px; font-size:12px; margin:0;"
                        onclick="toggleAllCards(true)">全カード ON</button>
                    <button class="btn" style="background:#c0392b; padding:6px 12px; font-size:12px; margin:0;"
                        onclick="toggleAllCards(false)">全カード OFF</button>
                </div>
                <div id="card-switches"></div>
                <div style="text-align: right; margin-top: 15px;">
                    <button class="btn" style="background:#7f8c8d;" onclick="closeSettingsModal()">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cutin-overlay" class="cutin-overlay hidden">
        <div class="cutin-content">
            <img id="cutin-image" src="" alt="カードイラスト">
            <h1 id="cutin-title"></h1>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = null;
        let myPlayerNumber = null;
        let latestGameState = null;
        let currentCardSettings = {};

        const CARD_NAMES = {
            gold_bag: '金袋',
            wood_sword: '木の剣',
            wood_shield: '木の盾',
            wood_shield_set: '木の盾セット',
            disaster: '大災害' // 追加
        };

        socket.on('connect', () => { myId = socket.id; });

        socket.on('init', (data) => {
            myPlayerNumber = data.playerNumber;
            myId = data.id;
            document.getElementById('status').innerText = `あなたは P${myPlayerNumber} です。他のプレイヤーを待っています...`;
        });

        socket.on('playerUpdate', (data) => {
            if (!latestGameState || !latestGameState.started) {
                document.getElementById('status').innerText = `現在の参加人数: ${data.playerCount} / 4 人`;
            }
        });

        socket.on('updateCardSettings', (settings) => {
            currentCardSettings = settings;
            renderCardSwitches();
        });

        // サーバーからのカットイン指示を受信
        socket.on('showCutIn', (data) => {
            // 操作中モーダルが開いていれば閉じる
            closeDropActionModal();

            const overlay = document.getElementById('cutin-overlay');
            const img = document.getElementById('cutin-image');
            const title = document.getElementById('cutin-title');

            img.src = data.imagePath;
            title.textContent = data.title;

            // 表示開始
            overlay.classList.remove('hidden');

            // アニメーション終了（2.5秒後）に自動で隠す
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 2500);
        });

        function renderCardSwitches() {
            const container = document.getElementById('card-switches');
            if (!container) return;
            container.innerHTML = '';

            Object.keys(CARD_NAMES).forEach(cardId => {
                const isEnabled = currentCardSettings[cardId] !== false;
                const div = document.createElement('div');
                div.className = 'switch-item';
                div.innerHTML = `
                    <span><b>${CARD_NAMES[cardId]}</b></span>
                    <label>
                        <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleCard('${cardId}', this.checked)">
                        ${isEnabled ? 'ON' : 'OFF'}
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function toggleCard(cardId, enabled) {
            socket.emit('toggleCardSetting', { cardId, enabled });
        }

        function toggleAllCards(enabled) {
            Object.keys(CARD_NAMES).forEach(cardId => {
                socket.emit('toggleCardSetting', { cardId, enabled });
            });
        }

        function openSettingsModal() { document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

        socket.on('draftStart', (data) => {
            renderDraftUI(data.availableScores, '最初の得点を選択してください：');
        });

        socket.on('draftConflict', (data) => {
            const draftArea = document.getElementById('draft-area');
            updatePlayersUI(data.players, null);

            // ★ 追加: ドラフト競合時もプレイヤー情報が渡ってくるため更新
            renderDebugScorePanel(data.players); if (data.unresolvedIds.includes(myId)) {
                document.getElementById('status').innerText = '選択が被りました！再選択してください。';
                if (draftArea) renderDraftUI(data.availableScores, '残りの選択肢から選んでください：');
            } else {
                document.getElementById('status').innerText = 'あなたの得点は確定しました。他のプレイヤーの再選択を待っています...';
                if (draftArea) {
                    draftArea.style.display = 'block';
                    draftArea.innerHTML = '';
                }
            }
        });

        function renderDraftUI(scores, titleText) {
            const draftArea = document.getElementById('draft-area');
            if (!draftArea) return;
            draftArea.style.display = 'block';
            draftArea.innerHTML = `<h3>${titleText}</h3><div id="draft-btns"></div>`;
            const btnContainer = document.getElementById('draft-btns');

            scores.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = (s > 0 ? '+' : '') + s + '点';
                btn.onclick = () => {
                    socket.emit('selectDraftScore', s);
                    btnContainer.querySelectorAll('button').forEach(b => b.disabled = true);
                    document.getElementById('status').innerText = '選択を送信しました。他のプレイヤーを待っています...';
                };
                btnContainer.appendChild(btn);
            });
        }

        socket.on('errorMessage', (msg) => { alert(msg); });

        socket.on('syncGameState', (data) => {
            latestGameState = data;
            document.getElementById('status').innerText = '';

            const draftArea = document.getElementById('draft-area');
            if (draftArea) {
                draftArea.style.display = 'none';
                draftArea.innerHTML = '';
            }

            document.getElementById('game-main').style.display = 'block';
            document.getElementById('round-info').innerText = `第 ${data.round} 巡目 / 全10巡`;
            if (data.log) {
                const logBox = document.getElementById('log-box');
                logBox.innerText = data.log + '\n' + logBox.innerText;
            }

            updatePlayersUI(data.players, data.currentTurnPlayerId);
            updateTurnControls(data);

            // ★ 追加: スコア調整パネルの表示を更新する
            renderDebugScorePanel(data.players);
        });

        // プレイヤーのスコア操作パネルを描画
        function renderDebugScorePanel(players) {
            const container = document.getElementById('debug-score-list');
            if (!container || !players) return;

            const playerList = Object.values(players).sort((a, b) => a.number - b.number);
            if (playerList.length === 0) {
                container.innerHTML = '<div style="color: #94a3b8; font-size: 11px;">プレイヤー接続待機中...</div>';
                return;
            }

            container.innerHTML = '';
            playerList.forEach(p => {
                const row = document.createElement('div');
                row.className = 'debug-p-row';
                row.innerHTML = `
                    <span style="font-weight:bold; min-width:30px;">P${p.number}:</span>
                    <input type="number" class="debug-score-input" id="debug-input-${p.id}" value="${p.score}" step="500">
                    <button style="background:#27ae60; padding:2px 6px; font-size:10px; border:none; border-radius:3px; color:white; cursor:pointer;" onclick="setDebugScoreDirect('${p.id}')">Set</button>
                    <div class="debug-btn-group">
                        <button onclick="changeDebugScore('${p.id}', 1000)">+1k</button>
                        <button onclick="changeDebugScore('${p.id}', -1000)">-1k</button>
                        <button onclick="changeDebugScore('${p.id}', 5000)">+5k</button>
                        <button onclick="changeDebugScore('${p.id}', -5000)">-5k</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // 得点を増減させる処理
        function changeDebugScore(targetPlayerId, amount) {
            socket.emit('debugUpdateScore', { targetPlayerId, amount, setDirect: false });
        }

        // 得点を直接入力値に変更する処理
        function setDebugScoreDirect(targetPlayerId) {
            const input = document.getElementById(`debug-input-${targetPlayerId}`);
            if (input && input.value !== '') {
                socket.emit('debugUpdateScore', { targetPlayerId, amount: Number(input.value), setDirect: true });
            }
        }

        function updatePlayersUI(players, currentTurnPlayerId) {
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);
            const playerList = Object.values(players).sort((a, b) => a.number - b.number);

            let myIndex = playerList.findIndex(p => p.id === myId);
            if (myIndex === -1) myIndex = 0;

            const totalPlayers = playerList.length;

            const seats = {
                bottom: document.getElementById('seat-bottom'),
                right: document.getElementById('seat-right'),
                top: document.getElementById('seat-top'),
                left: document.getElementById('seat-left')
            };

            Object.values(seats).forEach(s => { if (s) s.innerHTML = ''; });

            const seatKeys = ['bottom', 'right', 'top', 'left'];

            playerList.forEach((p, idx) => {
                const relativePos = (idx - myIndex + totalPlayers) % totalPlayers;
                const targetSeatKey = seatKeys[relativePos];
                const targetContainer = seats[targetSeatKey];

                if (!targetContainer) return;

                const isMe = (p.id === myId);
                const isTurn = (p.id === currentTurnPlayerId);
                // 自分より得点が高いプレイヤーの数 + 1 を順位とする
                const rank = Object.values(players).filter(sp => sp.score > p.score).length + 1;
                const box = document.createElement('div');
                box.className = `player-box ${isTurn ? 'active' : ''}`;

                let defInfo = '<span style="color:#7f8c8d;">なし</span>';
                if (p.defenseCard) {
                    const card = p.defenseCard.card;
                    const clickAttr = isMe ? `onclick="openDropCardModal('DEFENSE', null)"` : '';

                    // 自分・対戦相手問わず、防御カードにマウスオーバーした際にツールチップとホバーモーションを表示
                    defInfo = `
        <span style="color:#2ecc71;">
            <div class="def-card-wrapper">
                ${card.image ? `<img src="${card.image}" class="mini-card-icon ${isMe ? 'draggable-def-card' : ''}" ${clickAttr}>` : ''}
                <div class="card-tooltip">
                    <div style="font-weight: bold; color: #f1c40f; margin-bottom: 3px;">${card.name}</div>
                    <div>${card.desc}</div>
                </div>
            </div>
            ${card.name} (${p.defenseCard.usesLeft}回)
        </span>
    `;
                }

                const posNames = ['【自分】', '【下家】', '【対面】', '【上家】'];
                const posName = posNames[relativePos];

                let handHtml = '';
                if (isMe) {
                    handHtml += `<div style="margin-top:6px;"><b>手札 (クリックして使用)</b>`;
                    if (p.hand && p.hand.length > 0) {
                        handHtml += `<div class="my-hand-container">`;
                        p.hand.forEach(card => {
                            handHtml += `
                                <div class="hand-card-wrapper">
                                    <img src="${card.image}" class="card-img" alt="${card.name}" onclick="openDropCardModal('HAND', '${card.instanceId}')">
                                    <div class="card-tooltip">
                                        <div style="font-weight: bold; color: #f1c40f; margin-bottom: 3px;">${card.name}</div>
                                        <div>${card.desc}</div>
                                    </div>
                                </div>
                            `;
                        });
                        handHtml += `</div>`;
                    } else {
                        handHtml += ` <span style="color:#7f8c8d;">(なし)</span>`;
                    }
                    handHtml += `</div>`;
                }

                let scoreDisplayHtml = '';
                if (p.scoreChange && p.scoreChange !== 0) {
                    const color = p.scoreChange > 0 ? '#2ecc71' : '#e74c3c';
                    const sign = p.scoreChange > 0 ? '+' : '';
                    scoreDisplayHtml = `持ち点: ${p.prevScore.toLocaleString()}点<span style="color: ${color}; font-weight: bold;">${sign}${p.scoreChange.toLocaleString()}点</span>→${p.score.toLocaleString()}点`;
                } else {
                    scoreDisplayHtml = `持ち点: ${p.score.toLocaleString()}点`;
                }

                let statusBadge = p.immunityCount > 0 ? `<span style="color:#e74c3c; font-weight:bold; margin-left:5px;">[選択不可:${p.immunityCount}]</span>` : '';

                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${posName} P${p.number} ${isMe ? '(あなた)' : ''} ${isTurn ? '★' : ''}${statusBadge}</strong>
                        <span style="color:#f1c40f; font-weight:bold;"> ${rank}位</span>
                    </div>
                    <div style="font-size: 1.1em; font-weight: bold; margin: 3px 0; color: #38bdf8;">
                        ${scoreDisplayHtml}
                    </div>
                    <div>手札: <b>${p.hand ? p.hand.length : 0}</b> 枚 | 防御: ${defInfo}</div>
                    ${handHtml}
                `;

                targetContainer.appendChild(box);
            });
        }

        function chooseBonusChoice(accept) {
            socket.emit('chooseBonus', accept);
            document.getElementById('bonus-choice-modal').style.display = 'none';
        }

        function updateTurnControls(data) {
            const roundInfo = document.getElementById('round-info');
            const endTurnBtnContainer = document.getElementById('center-end-turn-btn');
            const centerStatus = document.getElementById('center-status');
            const bonusModal = document.getElementById('bonus-choice-modal');
            const discardModal = document.getElementById('discard-modal');

            const isMyTurn = (data.currentTurnPlayerId === myId);
            const myPlayer = data.players[myId];

            roundInfo.innerHTML = `第 ${data.round} 巡目 / 全10巡`;
            endTurnBtnContainer.innerHTML = '';
            if (centerStatus) centerStatus.innerText = '';
            if (bonusModal) bonusModal.style.display = 'none';
            if (discardModal) discardModal.style.display = 'none';

            if (!isMyTurn) return;

            if (data.turnPhase === 'BONUS_CHOICE') {
                if (bonusModal) bonusModal.style.display = 'block';
                roundInfo.innerHTML += ` <span style="color:#f1c40f;">【ボーナス選択中】</span>`;
            } else if (data.turnPhase === 'MAIN') {
                roundInfo.innerHTML += `<br><span style="color:#f1c40f; font-size: 0.85em;">★ あなたのターンです</span>`;
                if (centerStatus) centerStatus.innerText = '手札のカードをクリックして使用';

                endTurnBtnContainer.innerHTML = `
                    <button class="btn" style="background:#2980b9; height:100%; white-space:nowrap; margin:0; padding:0 12px; font-weight:bold;" onclick="socket.emit('endTurn')">
                        ターン終了
                    </button>
                `;
            } else if (data.turnPhase === 'DISCARD') {
                roundInfo.innerHTML += ` <span style="color:#e74c3c;">【手札オーバー】</span>`;

                const discardContainer = document.getElementById('discard-cards-container');
                if (discardContainer && myPlayer && myPlayer.hand) {
                    discardContainer.innerHTML = '';
                    myPlayer.hand.forEach(card => {
                        const itemDiv = document.createElement('div');
                        itemDiv.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:8px; background:#1a252f; padding:10px; border-radius:8px; border:1px solid #475569;';
                        itemDiv.innerHTML = `
                            <img src="${card.image}" style="width:90px; height:130px; object-fit:contain; border-radius:4px; background:#000;" alt="カード">
                            <button class="btn" style="background:#e74c3c; width:100%; margin:0; padding:6px 0; font-weight:bold;" onclick="socket.emit('discardCard', '${card.instanceId}')">捨てる</button>
                        `;
                        discardContainer.appendChild(itemDiv);
                    });
                    if (discardModal) discardModal.style.display = 'block';
                }
            }
        }

        function closeDropActionModal() {
            document.getElementById('drop-action-modal').style.display = 'none';
        }

        // 範囲攻撃カード等の下位プレイヤーに対する各対象ごとの命中率算出関数
        function calculateLowerTargetsHitRates(lowerPlayers) {
            if (!lowerPlayers || lowerPlayers.length === 0) return [];

            const sorted = [...lowerPlayers].sort((a, b) => b.score - a.score);
            const groups = [];
            sorted.forEach(p => {
                let lastGroup = groups[groups.length - 1];
                if (lastGroup && lastGroup.score === p.score) {
                    lastGroup.players.push(p);
                } else {
                    groups.push({ score: p.score, players: [p] });
                }
            });

            const result = [];
            let pMiss = 1.0;

            groups.forEach(group => {
                const m = group.players.length;
                const groupHitProb = pMiss * (1 - Math.pow(0.5, m));
                const individualHitProb = groupHitProb / m;

                group.players.forEach(p => {
                    const ratePercent = Math.round(individualHitProb * 1000) / 10;
                    result.push({ player: p, hitRate: ratePercent });
                });

                pMiss = pMiss * Math.pow(0.5, m);
            });

            return result;
        }

        // ドロップダウン選択時の命中率表示更新関数
        function updateHitRateDisplay(selectEl) {
            if (!selectEl) return;
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const displayEl = document.getElementById('hit-rate-info');
            if (selectedOption && displayEl) {
                const rateInfo = selectedOption.getAttribute('data-hitrate');
                if (rateInfo) {
                    displayEl.innerHTML = `🎯 命中率: <span style="color:#f1c40f; font-weight:bold;">${rateInfo}</span>`;
                } else {
                    displayEl.innerText = '';
                }
            }
        }

        function openDropCardModal(source, instanceId) {
            if (!latestGameState) return;

            const currentTurnId = latestGameState.currentTurnPlayerId;
            if (myId !== currentTurnId || latestGameState.turnPhase !== 'MAIN') return;

            const myPlayer = latestGameState.players[myId];
            if (!myPlayer) return;

            let isBlockedByDefense = false;

            if (source === 'HAND') {
                const targetHandCard = myPlayer.hand.find(c => String(c.instanceId) === String(instanceId));
                if (myPlayer.defenseCard && targetHandCard && !targetHandCard.allowWithDefense) {
                    isBlockedByDefense = true;
                    source = 'DEFENSE';
                }
            }

            const modal = document.getElementById('drop-action-modal');
            const preview = document.getElementById('drop-modal-card-preview');
            const actions = document.getElementById('drop-modal-actions');
            const title = document.getElementById('drop-modal-title');

            preview.innerHTML = '';
            actions.innerHTML = '';

            let card = null;
            let usesLeft = 1;

            if (source === 'HAND') {
                card = myPlayer.hand.find(c => String(c.instanceId) === String(instanceId));
                usesLeft = card ? (card.id === 'wood_shield_set' ? (card.usesLeft || 3) : 1) : 1;
            } else if (source === 'DEFENSE') {
                if (myPlayer.defenseCard) {
                    card = myPlayer.defenseCard.card;
                    usesLeft = myPlayer.defenseCard.usesLeft;
                }
            }

            if (!card) return;

            if (isBlockedByDefense) {
                title.innerHTML = `<span style="color:#e74c3c; font-size:0.9em; display:block; margin-bottom:4px;">防御カードがセットされています</span>【防御カード操作】${card.name}`;
            } else {
                title.innerText = source === 'HAND' ? `【手札操作】${card.name}` : `【防御カード操作】${card.name}`;
            }

            preview.innerHTML = `
        ${card.image ? `<img src="${card.image}" style="width:110px; height:160px; object-fit:contain; border-radius:6px; margin:0 auto; display:block;">` : ''}
        <p style="font-size:0.85em; color:#cbd5e1; margin:8px 0 0 0;">${card.desc}</p>
    `;

            const hasDefense = !!myPlayer.defenseCard;
            let html = '';

            if (source === 'HAND') {
                if (card.id === 'gold_bag') {
                    html += `<button class="btn" style="background:#27ae60; font-size:1.05em; width:100%;" onclick="socket.emit('playCard', { instanceId: '${card.instanceId}' }); closeDropActionModal();">使用する (+3000点)</button>`;
                } else if (card.id === 'disaster') { // ★ 追加[cite: 28]
                    html += `<button class="btn" style="background:#c0392b; font-size:1.05em; width:100%; font-weight:bold;" onclick="socket.emit('playCard', { instanceId: '${card.instanceId}' }); closeDropActionModal();">大災害を発動する</button>`;
                } else {
                    const myOrderIdx = latestGameState.turnOrder.indexOf(myId);
                    html += `<div style="background:#1a252f; padding:10px; border-radius:6px; margin-bottom:10px; text-align:left;">`;
                    html += `<b style="color:#e74c3c;">⚔ 攻撃する:</b><br>`;
                    html += `対象: <select id="drop-target-${card.instanceId}" onchange="updateHitRateDisplay(this)">`;

                    if (card.id === 'wood_sword') {
                        const allPlayers = Object.values(latestGameState.players);
                        const myScore = myPlayer.score;

                        allPlayers.forEach((p) => {
                            if (p.id !== myId) {
                                const scoreDiff = p.score - myScore;
                                const isImmune = p.immunityCount && p.immunityCount > 0;

                                if (scoreDiff >= 0 && scoreDiff <= 5000 && !isImmune) {
                                    html += `<option value="${p.id}" data-hitrate="50%">${p.name} (命中率: 50%)</option>`;
                                }
                            }
                        });

                        let lowerPlayers = allPlayers.filter(p => p.score < myScore && (!p.immunityCount || p.immunityCount <= 0)); // ★ 選択不可状態のプレイヤーを除外
                        if (lowerPlayers.length > 0) {
                            if (latestGameState.round === 1) {
                                lowerPlayers = lowerPlayers.filter(p => {
                                    const pOrderIdx = latestGameState.turnOrder.indexOf(p.id);
                                    return pOrderIdx <= myOrderIdx;
                                });
                            }

                            if (lowerPlayers.length > 0) {
                                const hitRates = calculateLowerTargetsHitRates(lowerPlayers);
                                const rateDetailStr = hitRates.map(item => `${item.player.name}: ${item.hitRate}%`).join(', ');
                                html += `<option value="ALL_LOWER" data-hitrate="${rateDetailStr}">下位全員 (${rateDetailStr})</option>`;
                            }
                        }
                    } else {
                        // 手札から操作する場合の「ATTACK」部分のリスト構築処理
                        Object.values(latestGameState.players).forEach(p => {
                            if (p.id !== myId) {
                                const pOrderIdx = latestGameState.turnOrder.indexOf(p.id);
                                const isImmune = p.immunityCount && p.immunityCount > 0;

                                if (latestGameState.round === 1 && pOrderIdx > myOrderIdx) {
                                    // 1巡目は自分より後のプレイヤーを選択不可
                                } else if (!isImmune) {
                                    if (card.id === 'wood_shield' || card.id === 'wood_shield_set') {
                                        const diff = myPlayer.score - p.score;
                                        // 得点差が ±10000点以上（命中率0%）の場合は除外
                                        if (Math.abs(diff) < 10000) {
                                            const hitRate = Math.max(0, 1 - Math.abs(diff) / 10000);
                                            const ratePercent = Math.round(hitRate * 100);
                                            html += `<option value="${p.id}" data-hitrate="${ratePercent}%">${p.name} (命中率: ${ratePercent}%)</option>`;
                                        }
                                    } else {
                                        html += `<option value="${p.id}" data-hitrate="50%">${p.name} (命中率: 50%)</option>`;
                                    }
                                }
                            }
                        });
                    }

                    html += `</select><br>`;
                    html += `<div id="hit-rate-info" style="font-size:0.85em; margin-top:4px; min-height:1.2em;"></div>`;

                    if (card.id === 'wood_shield_set') {
                        html += `回数: <select id="drop-attack-count-${card.instanceId}">`;
                        for (let i = 1; i <= usesLeft; i++) {
                            html += `<option value="${i}">${i}回</option>`;
                        }
                        html += `</select><br>`;
                    }

                    html += `<button class="btn" style="background:#e74c3c; margin-top:5px; width:100%;" onclick="executeDropPlayCard('${card.instanceId}', 'ATTACK')">攻撃実行</button>`;
                    html += `</div>`;

                    html += `<div style="margin-bottom:8px;">`;
                    if (hasDefense) {
                        html += `<button class="btn" disabled style="background:#7f8c8d; width:100%;">防御にセット不可 (すでにセット中)</button>`;
                    } else {
                        html += `<button class="btn" style="background:#2980b9; width:100%;" onclick="socket.emit('playCard', { instanceId: '${card.instanceId}', actionTarget: 'DEFENSE' }); closeDropActionModal();">防御にセット</button>`;
                    }
                    html += `</div>`;
                }
            } else if (source === 'DEFENSE') {
                const myOrderIdx = latestGameState.turnOrder.indexOf(myId);
                html += `<div style="background:#1a252f; padding:10px; border-radius:6px; margin-bottom:10px; text-align:left;">`;
                html += `<b style="color:#e74c3c;">⚔ 防御を外して攻撃:</b><br>`;
                html += `対象: <select id="drop-def-attack-target" onchange="updateHitRateDisplay(this)">`;
                // 防御カードを解除して攻撃する場合のリスト構築処理 (source === 'DEFENSE')
                Object.values(latestGameState.players).forEach(p => {
                    if (p.id !== myId) {
                        const pOrderIdx = latestGameState.turnOrder.indexOf(p.id);
                        const isImmune = p.immunityCount && p.immunityCount > 0;
                        if (latestGameState.round === 1 && pOrderIdx > myOrderIdx) {
                            // 1巡目は自分より後のプレイヤーを選択不可
                        } else if (!isImmune) {
                            if (card.id === 'wood_shield' || card.id === 'wood_shield_set') {
                                const diff = myPlayer.score - p.score;
                                // 得点差が ±10000点以上（命中率0%）の場合は除外
                                if (Math.abs(diff) < 10000) {
                                    const hitRate = Math.max(0, 1 - Math.abs(diff) / 10000);
                                    const ratePercent = Math.round(hitRate * 100);
                                    html += `<option value="${p.id}" data-hitrate="${ratePercent}%">${p.name} (命中率: ${ratePercent}%)</option>`;
                                }
                            } else {
                                html += `<option value="${p.id}" data-hitrate="50%">${p.name} (命中率: 50%)</option>`;
                            }
                        }
                    }
                });
                html += `</select><br>`;
                html += `<div id="hit-rate-info" style="font-size:0.85em; margin-top:4px; min-height:1.2em;"></div>`;

                if (card.id === 'wood_shield_set') {
                    html += `回数: <select id="drop-def-attack-count">`;
                    for (let i = 1; i <= usesLeft; i++) {
                        html += `<option value="${i}">${i}回</option>`;
                    }
                    html += `</select><br>`;
                }

                html += `<button class="btn" style="background:#e74c3c; margin-top:5px; width:100%;" onclick="executeDropDefenseAttack()">攻撃する</button>`;
                html += `</div>`;

                html += `<button class="btn" style="background:#c0392b; width:100%;" onclick="socket.emit('discardDefense'); closeDropActionModal();">防御カードを破棄</button>`;
            }

            actions.innerHTML = html;
            modal.style.display = 'block';

            // モーダル表示時に初期選択対象の命中率を表示
            const targetSelect = document.getElementById(`drop-target-${card.instanceId}`) || document.getElementById('drop-def-attack-target');
            if (targetSelect) {
                updateHitRateDisplay(targetSelect);
            }
        }

        function executeDropPlayCard(instanceId, actionTarget) {
            let targetPlayerId = null;
            let attackCount = 1;

            if (actionTarget === 'ATTACK') {
                const targetSelect = document.getElementById(`drop-target-${instanceId}`);
                if (targetSelect) targetPlayerId = targetSelect.value;
                const countSelect = document.getElementById(`drop-attack-count-${instanceId}`);
                if (countSelect) attackCount = countSelect.value;
            }

            socket.emit('playCard', { instanceId, actionTarget, targetPlayerId, attackCount });
            closeDropActionModal();
        }

        function executeDropDefenseAttack() {
            const targetSelect = document.getElementById('drop-def-attack-target');
            if (!targetSelect) return;

            const targetPlayerId = targetSelect.value;
            const countSelect = document.getElementById('drop-def-attack-count');
            const attackCount = countSelect ? countSelect.value : 1;

            socket.emit('playDefenseAsAttack', { targetPlayerId, attackCount });
            closeDropActionModal();
        }
    </script>
