<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カード対戦ゲーム</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: #ecf0f1; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; position: relative; }
        .card { background: #34495e; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn { background: #e67e22; border: none; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .player-box { background: #1a252f; padding: 10px; border-radius: 6px; border: 2px solid transparent; }
        .player-box.active { border-color: #f1c40f; }
        .hand-card { background: #27ae60; padding: 10px; margin: 5px 0; border-radius: 4px; }
        
        /* 右上設定ボタン */
        .settings-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #7f8c8d;
            font-size: 14px;
            padding: 8px 12px;
        }

        /* モーダル汎用 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            text-align: center;
            padding-top: 80px;
        }
        .modal-content {
            background: #34495e;
            display: inline-block;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #bdc3c7;
            max-width: 500px;
            width: 90%;
            text-align: left;
        }

        /* 罠モーダル特有 */
        #trap-modal-content {
            border-color: #e74c3c;
            text-align: center;
        }
        .trap-btn { font-size: 20px; padding: 15px 25px; margin: 10px; background: #3498db; }
        .trap-slot-text { font-size: 0.9em; margin-left: 10px; }

        /* スイッチリストUI */
        .switch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #2c3e50;
            margin-bottom: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn settings-btn" onclick="openSettingsModal()">⚙ デバッグ設定</button>

        <h2>対戦カードゲーム</h2>
        <div id="status">接続待機中...</div>

        <!-- ドラフトエリア -->
        <div id="draft-area" class="card" style="display: none;"></div>

        <!-- ゲームメイン画面 -->
        <div id="game-main" style="display: none;">
            <div id="round-info" style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px;"></div>
            
            <div class="grid" id="players-grid"></div>

            <div class="card" style="margin-top: 15px;">
                <h3>ログ</h3>
                <div id="log-box" style="height: 100px; overflow-y: auto; background: #111; padding: 10px; font-family: monospace;"></div>
            </div>

            <!-- アクション操作エリア -->
            <div id="action-panel" class="card" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- カードスイッチ設定モーダル -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">⚙ カード排出スイッチ (デバッグ)</h3>
            <p style="font-size: 0.85em; color: #bdc3c7;">OFFにするとターン開始時のカード獲得で引けなくなります。</p>
            <div id="card-switches"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="btn" style="background:#7f8c8d;" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 罠対決モーダルUI -->
    <div id="trap-modal" class="modal">
        <div id="trap-modal-content" class="modal-content">
            <h2 style="color: #e74c3c;">【 罠 発 動 ! 】</h2>
            <p id="trap-desc">攻撃が発生しました！選択してください。</p>
            <div id="trap-buttons">
                <button class="btn trap-btn" onclick="sendTrapChoice('LEFT')">左</button>
                <button class="btn trap-btn" onclick="sendTrapChoice('CENTER')">中</button>
                <button class="btn trap-btn" onclick="sendTrapChoice('RIGHT')">右</button>
            </div>
            <p id="trap-status-text" style="color: #f1c40f; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = null;
        let myPlayerNumber = null;
        let latestGameState = null;
        let currentCardSettings = {};

        const CARD_NAMES = {
            gold_bag: '金袋',
            wood_sword: '木の剣',
            wood_shield: '木の盾',
            wood_shield_set: '木の盾セット'
        };

        socket.on('connect', () => { myId = socket.id; });

        socket.on('init', (data) => {
            myPlayerNumber = data.playerNumber;
            myId = data.id;
            document.getElementById('status').innerText = `あなたは P${myPlayerNumber} です。他のプレイヤーを待っています...`;
        });

        socket.on('playerUpdate', (data) => {
            if (!latestGameState || !latestGameState.started) {
                document.getElementById('status').innerText = `現在の参加人数: ${data.playerCount} / 4 人`;
            }
        });

        // カードスイッチ設定同期
        socket.on('updateCardSettings', (settings) => {
            currentCardSettings = settings;
            renderCardSwitches();
        });

        function renderCardSwitches() {
            const container = document.getElementById('card-switches');
            if (!container) return;
            container.innerHTML = '';

            Object.keys(CARD_NAMES).forEach(cardId => {
                const isEnabled = currentCardSettings[cardId] !== false;
                const div = document.createElement('div');
                div.className = 'switch-item';
                div.innerHTML = `
                    <span><b>${CARD_NAMES[cardId]}</b></span>
                    <label>
                        <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleCard('${cardId}', this.checked)">
                        ${isEnabled ? 'ON' : 'OFF'}
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function toggleCard(cardId, enabled) {
            socket.emit('toggleCardSetting', { cardId, enabled });
        }

        function openSettingsModal() { document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

        socket.on('draftStart', (data) => {
            renderDraftUI(data.availableScores, '最初の得点を選択してください：');
        });

        socket.on('draftConflict', (data) => {
            const draftArea = document.getElementById('draft-area');
            updatePlayersUI(data.players, null);
            if (data.unresolvedIds.includes(myId)) {
                document.getElementById('status').innerText = '選択が被りました！再選択してください。';
                if (draftArea) renderDraftUI(data.availableScores, '残りの選択肢から選んでください：');
            } else {
                document.getElementById('status').innerText = 'あなたの得点は確定しました。他のプレイヤーの再選択を待っています...';
                if (draftArea) {
                    draftArea.style.display = 'block';
                    draftArea.innerHTML = '';
                }
            }
        });

        function renderDraftUI(scores, titleText) {
            const draftArea = document.getElementById('draft-area');
            if (!draftArea) return;
            draftArea.style.display = 'block';
            draftArea.innerHTML = `<h3>${titleText}</h3><div id="draft-btns"></div>`;
            const btnContainer = document.getElementById('draft-btns');

            scores.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = (s > 0 ? '+' : '') + s + '点';
                btn.onclick = () => {
                    socket.emit('selectDraftScore', s);
                    btnContainer.querySelectorAll('button').forEach(b => b.disabled = true);
                    document.getElementById('status').innerText = '選択を送信しました。他のプレイヤーを待っています...';
                };
                btnContainer.appendChild(btn);
            });
        }

        socket.on('trapBattleStart', (data) => {
            const modal = document.getElementById('trap-modal');
            const desc = document.getElementById('trap-desc');
            const statusText = document.getElementById('trap-status-text');
            const btns = document.getElementById('trap-buttons');

            modal.style.display = 'block';
            statusText.innerText = '';

            if (myId === data.attackerId || myId === data.targetId) {
                desc.innerHTML = `<b>${data.attackerName}</b> が <b>${data.targetName}</b> のスロット${data.slotNum}に攻撃！<br>罠「${data.trapName}」が作動しました。<br>10秒以内に【左・中・右】を選択してください！`;
                btns.style.display = 'block';
                btns.querySelectorAll('button').forEach(b => b.disabled = false);
            } else {
                desc.innerHTML = `<b>${data.attackerName}</b> と <b>${data.targetName}</b> が罠対決中です...`;
                btns.style.display = 'none';
            }
        });

        function sendTrapChoice(choice) {
            socket.emit('selectTrapChoice', choice);
            const btns = document.getElementById('trap-buttons');
            btns.querySelectorAll('button').forEach(b => b.disabled = true);
            document.getElementById('trap-status-text').innerText = '選択を送信しました。相手の選択を待っています...';
        }

        socket.on('trapBattleEnd', (data) => {
            document.getElementById('trap-modal').style.display = 'none';
        });

        socket.on('errorMessage', (msg) => { alert(msg); });

        socket.on('syncGameState', (data) => {
            latestGameState = data;
            document.getElementById('status').innerText = '';

            const draftArea = document.getElementById('draft-area');
            if (draftArea) {
                draftArea.style.display = 'none';
                draftArea.innerHTML = '';
            }

            document.getElementById('game-main').style.display = 'block';
            document.getElementById('round-info').innerText = `第 ${data.round} 巡目 / 全10巡`;
            if (data.log) {
                const logBox = document.getElementById('log-box');
                logBox.innerText = data.log + '\n' + logBox.innerText;
            }

            updatePlayersUI(data.players, data.currentTurnPlayerId);
            updateTurnControls(data);
        });

        function updatePlayersUI(players, currentTurnPlayerId) {
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';

            // 順位付けの計算
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);

            Object.values(players).forEach(p => {
                const isMe = (p.id === myId);
                const isTurn = (p.id === currentTurnPlayerId);
                const rank = sorted.findIndex(sp => sp.id === p.id) + 1;
                
                const box = document.createElement('div');
                box.className = `player-box ${isTurn ? 'active' : ''}`;
                
                let defInfo = p.defenseCard ? `${p.defenseCard.card.name} (残り${p.defenseCard.usesLeft}回)` : 'なし';

                let trapHtml = '<br>';
                [1, 2, 3].forEach(slotNum => {
                    const trapObj = p.trapSlots ? p.trapSlots[slotNum] : null;
                    if (trapObj) {
                        // 設置巡数(placedRound)を取得
                        const roundStr = trapObj.placedRound !== undefined ? ` / ${trapObj.placedRound}巡目` : '';
                        
                        // 自分自身、または一度発動して公開済み(revealed)の場合はカード名を表示
                        if (isMe || trapObj.revealed) {
                            trapHtml += `<span class="trap-slot-text" style="color:#e74c3c;">[スロット${slotNum}: ${trapObj.card.name}(残り${trapObj.usesLeft}回${roundStr})]</span><br>`;
                        } else {
                            // 他プレイヤーからはカード名を隠し、セット中と巡数のみ表示
                            trapHtml += `<span class="trap-slot-text" style="color:#e67e22;">[スロット${slotNum}: セット中(${roundStr.replace(' / ', '')})]</span><br>`;
                        }
                    } else {
                        trapHtml += `<span class="trap-slot-text" style="color:#7f8c8d;">[スロット${slotNum}: 空き]</span><br>`;
                    }
                });

                box.innerHTML = `
                    <h4>${p.name} ${isMe ? '(あなた)' : ''} ${isTurn ? '★' : ''} <span style="font-size:0.8em; color:#f1c40f;">(${rank}位)</span></h4>
                    <p>得点: ${p.score}点</p>
                    <p>手札枚数: ${p.hand ? p.hand.length : 0}枚</p>
                    <p>防御: ${defInfo}</p>
                    <p><b>罠スロット:</b> ${trapHtml}</p>
                `;
                grid.appendChild(box);
            });
        }

        function updateTurnControls(data) {
            const panel = document.getElementById('action-panel');
            const isMyTurn = (data.currentTurnPlayerId === myId);
            const myPlayer = data.players[myId];

            if (!isMyTurn) {
                panel.innerHTML = '<h3>他のプレイヤーのターンです...</h3>';
                return;
            }

            if (data.turnPhase === 'BONUS_CHOICE') {
                panel.innerHTML = `
                    <h3>あなたのターンです（ボーナス選択）</h3>
                    <p>ターン開始ボーナス (+3000点) を獲得しますか？</p>
                    <button class="btn" onclick="socket.emit('chooseBonus', true)">ボーナスを受け取る (+3000点 & カード獲得)</button>
                    <button class="btn" onclick="socket.emit('chooseBonus', false)">受け取らない (カードのみ獲得)</button>
                `;
            } else if (data.turnPhase === 'MAIN') {
                let html = `<h3>メインフェーズ (手札: ${myPlayer.hand.length}枚)</h3>`;
                
                if (myPlayer.hand.length === 0) {
                    html += '<p>使用できるカードがありません。</p>';
                } else {
                    const emptySlots = [1, 2, 3].filter(s => !myPlayer.trapSlots || !myPlayer.trapSlots[s]);
                    const hasDefense = !!myPlayer.defenseCard;

                    myPlayer.hand.forEach(card => {
                        html += `<div class="hand-card"><b>${card.name}</b> - ${card.desc}<br>`;
                        
                        if (card.id === 'gold_bag') {
                            html += `<button class="btn" onclick="playCard('${card.instanceId}')">使用する</button>`;

                        } else if (card.category === 'DEFENSE_TRAP') {
                            // --- 1. 攻撃アクション（木の剣のみ） ---
                            if (card.id === 'wood_sword') {
                                const myOrderIdx = data.turnOrder.indexOf(myId);

                                html += `対象: <select id="target-${card.instanceId}" onchange="updateAttackSlotOptions('${card.instanceId}')">`;
                                Object.values(data.players).forEach(p => {
                                    if (p.id !== myId) {
                                        const pOrderIdx = data.turnOrder.indexOf(p.id);
                                        if (data.round === 1 && pOrderIdx > myOrderIdx) {
                                            // 1巡目の後手除外
                                        } else {
                                            html += `<option value="${p.id}">${p.name}</option>`;
                                        }
                                    }
                                });
                                html += `</select> `;

                                html += `<span id="slot-container-${card.instanceId}">スロット: <select id="slot-${card.instanceId}"></select></span> `;
                                html += `<button class="btn" style="background:#e74c3c;" onclick="playCard('${card.instanceId}', 'ATTACK')">攻撃する</button><br>`;
                            }

                            // --- 2. 防御にセット ---
                            if (hasDefense) {
                                html += `<button class="btn" disabled style="background:#7f8c8d;" title="すでに防御カードがセットされています">防御にセット不可</button> `;
                            } else {
                                html += `<button class="btn" onclick="playCard('${card.instanceId}', 'DEFENSE')">防御にセット</button> `;
                            }
                            
                            // --- 3. 罠にセット ---
                            if (hasDefense) {
                                html += `<button class="btn" disabled style="background:#7f8c8d;" title="防御カードセット中は罠にセットできません">罠にセット不可(防御中)</button>`;
                            } else if (emptySlots.length > 0) {
                                html += `<button class="btn" onclick="playCard('${card.instanceId}', 'TRAP')">罠にセット</button> `;
                                html += `設置スロット: <select id="set-slot-${card.instanceId}">`;
                                emptySlots.forEach(s => {
                                    html += `<option value="${s}">スロット${s}</option>`;
                                });
                                html += `</select>`;
                            } else {
                                html += `<button class="btn" disabled style="background:#7f8c8d;">罠スロット満杯</button>`;
                            }
                        }

                        html += `</div>`;
                    });
                }

                if (myPlayer.defenseCard) {
                    const emptySlots = [1, 2, 3].filter(s => !myPlayer.trapSlots || !myPlayer.trapSlots[s]);
                    
                    html += `<div style="margin-top:15px; padding:10px; background:#2c3e50; border-radius:5px;">`;
                    html += `<b>【防御カードアクション】</b><br>`;
                    
                    if (emptySlots.length > 0) {
                        html += `移し替え先スロット: <select id="move-trap-slot">`;
                        emptySlots.forEach(s => {
                            html += `<option value="${s}">スロット${s}</option>`;
                        });
                        html += `</select> `;
                        html += `<button class="btn" style="background:#8e44ad;" onclick="moveDefenseToTrap()">防御カードを罠に移し替える</button> `;
                    } else {
                        html += `<span style="color:#e74c3c; font-size:0.9em;">（空きスロットがないため移し替え不可）</span> `;
                    }

                    html += `<button class="btn" style="background:#c0392b;" onclick="socket.emit('discardDefense')">セット中の防御カードを破棄する</button>`;
                    html += `</div>`;
                }

                html += `<br><button class="btn" style="background:#2980b9;" onclick="socket.emit('endTurn')">ターンを終了する</button>`;
                panel.innerHTML = html;

                myPlayer.hand.forEach(card => {
                    if (card.id === 'wood_sword') {
                        updateAttackSlotOptions(card.instanceId);
                    }
                });
            } else if (data.turnPhase === 'DISCARD') {
                let html = `<h3>手札オーバー！ 2枚以下になるようにカードを捨ててください。</h3>`;
                myPlayer.hand.forEach(card => {
                    html += `
                        <div class="hand-card">
                            <b>${card.name}</b>
                            <button class="btn" style="background:#e74c3c;" onclick="socket.emit('discardCard', '${card.instanceId}')">このカードを捨てる</button>
                        </div>
                    `;
                });
                panel.innerHTML = html;
            }
        }

        function updateAttackSlotOptions(instanceId) {
            const targetSelect = document.getElementById(`target-${instanceId}`);
            const slotSelect = document.getElementById(`slot-${instanceId}`);
            const slotContainer = document.getElementById(`slot-container-${instanceId}`);
            if (!targetSelect || !slotSelect || !latestGameState) return;

            const targetId = targetSelect.value;
            if (!targetId) {
                slotContainer.style.display = 'none';
                return;
            }

            const targetPlayer = latestGameState.players[targetId];
            if (!targetPlayer) return;

            const activeSlots = [1, 2, 3].filter(s => targetPlayer.trapSlots && targetPlayer.trapSlots[s]);

            slotSelect.innerHTML = '';

            if (activeSlots.length > 0) {
                slotContainer.style.display = 'inline';
                activeSlots.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.innerText = `スロット${s}`;
                    slotSelect.appendChild(opt);
                });
            } else {
                slotContainer.style.display = 'none';
                const opt = document.createElement('option');
                opt.value = 1;
                slotSelect.appendChild(opt);
            }
        }

        function playCard(instanceId, actionTarget = null) {
            let targetPlayerId = null;
            let trapSlotNum = null;

            const targetSelect = document.getElementById(`target-${instanceId}`);
            if (targetSelect) targetPlayerId = targetSelect.value;

            if (actionTarget === 'TRAP') {
                const setSlotSelect = document.getElementById(`set-slot-${instanceId}`);
                if (setSlotSelect) trapSlotNum = setSlotSelect.value;
            } else {
                const attackSlotSelect = document.getElementById(`slot-${instanceId}`);
                if (attackSlotSelect) trapSlotNum = attackSlotSelect.value;
            }

            socket.emit('playCard', { instanceId, actionTarget, targetPlayerId, trapSlotNum });
        }

        function moveDefenseToTrap() {
            const slotSelect = document.getElementById('move-trap-slot');
            if (!slotSelect) return;
            socket.emit('moveDefenseToTrap', { trapSlotNum: slotSelect.value });
        }
    </script>
</body>
</html>
